# Lint e testes unitários. Sem Ollama, sem Docker e sem segredos.
# Os testes usam embedder/cliente falsos; chromadb é opcional (test_indexer usa importorskip),
# então instalamos só o extra dev. O gate de prompts fica em eval.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências (extras dev e platform; sem o extra rag)
        run: pip install -e ".[dev,platform]"

      - name: Lint (ruff check)
        run: python -m ruff check .

      - name: Testes unitários
        run: python -m pytest -q

  # Opcional: confere que o portal (platform/portal) compila. Independente do job Python.
  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform/portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/portal/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Build (tsc --noEmit e vite build)
        run: npm run build

  # Testes de plataforma contra Postgres 16 (service container). Independente dos jobs test e portal.
  # A senha abaixo é um valor efêmero só deste job de CI (o serviço some ao fim); não é segredo do repositório.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AOK_TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-ephemeral-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências (extras dev e platform)
        run: pip install -e ".[dev,platform]"

      - name: Testes de plataforma em Postgres
        run: python -m pytest tests/test_platform_*.py -q

