# Lint e testes unitários. Sem Ollama, sem Docker e sem segredos.
# Os testes usam embedder/cliente falsos; chromadb é opcional (test_indexer usa importorskip),
# então instalamos só o extra dev. O gate de prompts fica em eval.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências (extras dev e platform; sem o extra rag)
        run: pip install -e ".[dev,platform]"

      - name: Lint (ruff check)
        run: python -m ruff check .

      - name: Testes unitários
        run: python -m pytest -q

  # Opcional: confere que o portal (platform/portal) compila. Independente do job Python.
  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform/portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/portal/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Build (tsc --noEmit e vite build)
        run: npm run build
