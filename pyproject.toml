[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ops-kit"
version = "0.1.0"
description = "Observabilidade, avaliação e segurança para agentes de IA."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-grpc",
]

[project.scripts]
aok = "agent_ops_kit.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]
rag = ["chromadb", "ollama"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
