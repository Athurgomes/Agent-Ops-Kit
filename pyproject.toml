[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ops-kit"
version = "0.1.0"
description = "Observabilidade, avaliação e segurança para agentes de IA."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-grpc",
]

[project.scripts]
aok = "agent_ops_kit.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]
rag = ["chromadb", "ollama"]
platform = ["fastapi", "uvicorn", "sqlalchemy>=2", "psycopg[binary]", "httpx"]

[tool.setuptools.packages.find]
where = ["src", "platform"]

[tool.setuptools.package-data]
agent_ops_kit = ["templates/agent/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "platform", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["src/agent_ops_kit/templates"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
